<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRI 貼文模板產生器</title>
    <!-- 引入 Google Fonts (Noto Sans TC & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
/* ==========================================================================
   Base & Application UI Reset
   ========================================================================== */
:root {
    /* Control Panel Variables */
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --bg-dark: #0B0F19;
    --surface: #1F2937;
    --border: #374151;
    --text-main: #F9FAFB;
    --text-muted: #9CA3AF;
}

/* ==========================================================================
   IG Post Theme Variables
   ========================================================================== */

.ig-post.theme-crimson {
    --ig-bg: #09090b; /* Very dark zinc */
    --ig-content-bg: #18181b; 
    --ig-border: #27272a;
    --ig-text-main: #fafafa;
    --ig-text-body: #a1a1aa;
    --ig-badge-bg: #e11d48; /* Elegant crimson red */
    --ig-badge-text: #ffffff;
}

.ig-post.theme-light {
    --ig-bg: #f3f4f6;
    --ig-content-bg: #ffffff;
    --ig-border: #e5e7eb;
    --ig-text-main: #111827;
    --ig-text-body: #4b5563;
    --ig-badge-bg: #111827;
    --ig-badge-text: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', 'Noto Sans TC', sans-serif;
    background-color: #111827;
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
}

.app-container {
    display: flex;
    height: 100vh;
}

/* ==========================================================================
   Left Control Panel
   ========================================================================== */
.control-panel {
    width: 380px;
    background-color: var(--surface);
    border-right: 1px solid var(--border);
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    overflow-y: auto;
    z-index: 10;
}

.control-panel h2 {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: #fff;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.form-group label {
    font-size: 0.875rem;
    color: var(--text-muted);
    font-weight: 500;
}

input[type="text"],
textarea,
.select-input {
    width: 100%;
    background-color: #111827;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.95rem;
    transition: border-color 0.2s;
    resize: vertical;
}

input[type="text"]:focus,
textarea:focus,
.select-input:focus {
    outline: none;
    border-color: var(--primary);
}

.radio-group {
    display: flex;
    gap: 1.5rem;
    background-color: #111827;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
}

.radio-group label {
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
}

.btn-primary {
    background-color: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 1rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: background-color 0.2s, transform 0.1s;
    margin-top: 1rem;
}

.btn-primary:hover {
    background-color: var(--primary-hover);
}
.btn-primary:active {
    transform: scale(0.98);
}

.help-text {
    font-size: 0.8rem;
    color: var(--text-muted);
    text-align: center;
}

/* ==========================================================================
   Right Preview Panel & Canvas Scaling
   ========================================================================== */
.preview-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #000;
    background-image: radial-gradient(circle at center, #1f2937 0%, #000 100%);
    overflow: hidden;
    position: relative;
}

/* The wrapper handles the responsive scaling so the 1080x1080 box fits the screen */
.canvas-wrapper {
    /* We use a specific aspect ratio or simply scale via JS/CSS */
    /* A quick CSS trick for scaling a fixed 1080px box to fit viewport */
    width: 1080px;
    height: 1080px;
    flex-shrink: 0;
    transform-origin: center center;
    /* We will set scale dynamically in JS based on window size, but set a fallback */
    transform: scale(0.6); 
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    border-radius: 12px;
    overflow: hidden;
}

/* ==========================================================================
   Instagram Post Template (1080x1080) - Dark Mode Premium
   ========================================================================== */
.ig-post {
    width: 1080px;
    height: 1080px;
    background-color: var(--ig-bg);
    display: flex;
    flex-direction: column;
    padding: 60px;
    gap: 40px;
    color: var(--ig-text-main);
    overflow: hidden;
    transform: translateZ(0); 
    position: relative;
}

/* --- Plain Solid Content Area --- */
.content-box {
    flex: 1;
    background: var(--ig-content-bg);
    border: 1px solid var(--ig-border);
    padding: 80px 80px;
    border-radius: 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 40px;
    overflow: hidden;
}

.subtitle-badge {
    align-self: flex-start;
    background: var(--ig-badge-bg);
    color: var(--ig-badge-text);
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.main-title {
    font-size: 85px;
    font-weight: 900;
    line-height: 1.15;
    margin: 10px 0;
    color: var(--ig-text-main);
    letter-spacing: -1px;
    word-break: break-word;
}

.body-text {
    font-size: 42px;
    line-height: 1.6;
    color: var(--ig-text-body);
    font-weight: 400;
    opacity: 0.9;
    white-space: pre-line;
}

/* --- Footer & Logo Placement --- */
.post-footer {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 20px;
}

/* Toggle classes controlled by JS */
.logo-bottom-left {
    justify-content: flex-start;
}

.logo-bottom-right {
    justify-content: flex-end;
}

.brand-logo {
    height: 70px;
    width: auto;
    object-fit: contain;
}

/* ==========================================================================
   Layout Modes & Image Styling
   ========================================================================== */

/* File Input Styling */
.file-input {
    background-color: #111827;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem;
    color: var(--text-main);
    width: 100%;
}

.file-input::-webkit-file-upload-button {
    background-color: #374151;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 0.5rem 1rem;
    cursor: pointer;
    margin-right: 1rem;
    transition: background 0.2s;
}

.file-input::-webkit-file-upload-button:hover {
    background-color: #4B5563;
}

/* Base image container */
.post-image {
    display: block;
    background-repeat: no-repeat;
}

/* Slider Controls */
.slider-group {
    margin-top: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 1rem;
    background: #1F2937;
    border: 1px solid #374151;
    border-radius: 8px;
}
.slider-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
}
.slider-item label {
    font-size: 0.8rem;
    color: #9CA3AF;
    min-width: 60px;
}
.slider-item input[type="range"] {
    flex: 1;
    accent-color: #4F46E5;
}

/* Layout A: Text Only (Solid Background) */
.layout-text .post-image {
    display: none;
}
.layout-text .content-box {
    flex: 1;
}

/* Layout B: Split Image & Text */
.layout-split {
    padding: 0;
    gap: 0;
}
.layout-split .post-image {
    flex: 1.2; /* Image takes slightly more than half */
    width: 100%;
    background-size: cover;
    background-position: center;
    background-color: #111827;
}
.layout-split .content-box {
    flex: 1;
    border: none;
    border-radius: 0;
    padding: 50px 80px 140px 80px; /* Extra bottom padding for footer */
    justify-content: center;
}
.layout-split .post-footer {
    position: absolute;
    bottom: 50px;
    left: 80px;
    right: 80px;
    padding: 0;
}

/* Layout C: Full Background Image */
.layout-bg {
    padding: 60px;
}
.layout-bg .post-image {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-size: cover;
    background-position: center;
    background-color: #111827;
    z-index: 1;
}
.layout-bg .post-image::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35); /* Dark overlay to make text readable */
}
.layout-bg .content-box {
    flex: 1;
    z-index: 2;
    background: rgba(31, 41, 55, 0.85); /* Semi-transparent */
    backdrop-filter: blur(12px);
    border-color: rgba(255,255,255,0.1);
}
.layout-bg .post-footer {
    z-index: 2;
}

/* Layout D: Gradient Fade */
.layout-fade {
    padding: 0;
    gap: 0;
}
.layout-fade .post-image {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 70%;
    background-size: cover;
    background-position: center;
    z-index: 1;
}
.layout-fade .post-image::after {
    content: '';
    position: absolute;
    inset: 0;
    /* Smooth gradient from transparent to theme background color */
    background: linear-gradient(to bottom, transparent 0%, var(--ig-bg) 100%);
}
.layout-fade .content-box {
    flex: 1;
    z-index: 2;
    background: transparent;
    border: none;
    margin-top: 40%;
    padding: 40px 80px 140px 80px;
    justify-content: flex-end;
}
.layout-fade .post-footer {
    position: absolute;
    bottom: 50px;
    left: 80px;
    right: 80px;
    padding: 0;
    z-index: 2;
}

/* Layout E: Duotone Blend */
.layout-duotone {
    padding: 60px;
    background-color: var(--ig-badge-bg); /* Use the accent color as base */
}
.layout-duotone .post-image {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    z-index: 1;
    filter: grayscale(100%);
    mix-blend-mode: luminosity; 
    opacity: 0.6; /* html2canvas fallback if blend-mode fails */
}
.layout-duotone .content-box {
    flex: 1;
    z-index: 2;
    background: transparent;
    border: none;
}
.layout-duotone .post-footer {
    z-index: 2;
}

/* Layout F: Floating Glassmorphism */
.layout-glass {
    padding: 0;
    justify-content: flex-end;
}
.layout-glass .post-image {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    z-index: 1;
}
.layout-glass .content-box {
    flex: none;
    z-index: 2;
    margin: 60px;
    margin-bottom: 160px; /* Space for footer */
    background: rgba(31, 41, 55, 0.7);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 40px;
    padding: 60px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}
.layout-glass .post-footer {
    position: absolute;
    bottom: 60px;
    left: 80px;
    right: 80px;
    padding: 0;
    z-index: 2;
}

</style>
</head>
<body>
    <div class="app-container">
        <!-- 左側控制面板 -->
        <aside class="control-panel">
            <h2>編輯貼文內容</h2>
            
            <div class="form-group">
                <label for="input-theme">色彩主題 (Color Theme)</label>
                <select id="input-theme" class="select-input">
                    <option value="theme-crimson">尊爵熾紅 (Crimson)</option>
                    <option value="theme-light">極簡晨白 (Light)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="input-layout">版式選擇 (Layout Style)</label>
                <select id="input-layout" class="select-input">
                    <option value="layout-text">A: 純文字</option>
                    <option value="layout-split">B: 上下圖文</option>
                    <option value="layout-bg">C: 滿版底圖</option>
                    <option value="layout-fade">D: 漸層羽化</option>
                    <option value="layout-duotone">E: 雙色調</option>
                    <option value="layout-glass">F: 懸浮玻璃</option>
                </select>
            </div>

            <div class="form-group" id="image-upload-group" style="display: none;">
                <label for="input-image">上傳圖片 (Image)</label>
                <input type="file" id="input-image" accept="image/*" class="file-input">
                
                <div class="slider-group">
                    <div class="slider-item">
                        <label for="input-zoom">縮放比例</label>
                        <input type="range" id="input-zoom" min="100" max="300" value="100">
                    </div>
                    <div class="slider-item">
                        <label for="input-x">左右平移</label>
                        <input type="range" id="input-x" min="0" max="100" value="50">
                    </div>
                    <div class="slider-item">
                        <label for="input-y">上下平移</label>
                        <input type="range" id="input-y" min="0" max="100" value="50">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="input-title">大標題 (Title)</label>
                <textarea id="input-title" rows="2" placeholder="請輸入主標題...">重要政策公告</textarea>
            </div>

            <div class="form-group">
                <label for="input-subtitle">副標題 (Subtitle)</label>
                <input type="text" id="input-subtitle" value="最新消息發布" placeholder="請輸入副標題...">
            </div>

            <div class="form-group">
                <label for="input-body">內文 (Body text)</label>
                <textarea id="input-body" rows="6" placeholder="請輸入主要說明文字...">在此輸入詳細的政策說明、活動時間或是重點摘要。
支援多行顯示，讓資訊傳遞更加清晰明確。</textarea>
                <div id="overflow-warning" style="display: none; color: #ef4444; font-size: 0.85rem; margin-top: 8px;">
                    ⚠️ 警告：文字過多，產出的圖片將會被裁切。
                </div>
            </div>

            <div class="form-group">
                <label>Logo 位置 (Logo Position)</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="logo-position" value="bottom-left" checked> 左下角
                    </label>
                    <label>
                        <input type="radio" name="logo-position" value="bottom-right"> 右下角
                    </label>
                </div>
            </div>

            <button id="btn-download" class="btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                下載 IG 貼文 (1080x1080)
            </button>
            <p class="help-text">提示: 畫面右側即為最終輸出的排版結果。</p>
        </aside>

        <!-- 右側預覽區 (畫布) -->
        <main class="preview-panel">
            <div class="canvas-wrapper">
                <!-- 真正的 1080x1080 匯出區塊 -->
                <div id="export-canvas" class="ig-post theme-dark layout-text">
                    <!-- 圖片容器 (Split 或 BG 版式使用) -->
                    <div class="post-image" id="render-image"></div>
                    
                    <!-- 內容區塊 (Solid Dark) -->
                    <div class="content-box">
                        <div class="subtitle-badge" id="render-subtitle">最新消息發布</div>
                        <h1 class="main-title" id="render-title">重要政策公告</h1>
                        <p class="body-text" id="render-body">在此輸入詳細的政策說明、活動時間或是重點摘要。<br>支援多行顯示，讓資訊傳遞更加清晰明確。</p>
                    </div>

    <!-- 引入 html2canvas CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', () => {
    // Input Elements
    const inputTitle = document.getElementById('input-title');
    const inputSubtitle = document.getElementById('input-subtitle');
    const inputBody = document.getElementById('input-body');
    const radioPositions = document.getElementsByName('logo-position');
    const inputLayout = document.getElementById('input-layout');
    const inputTheme = document.getElementById('input-theme');
    const inputImage = document.getElementById('input-image');
    const imageUploadGroup = document.getElementById('image-upload-group');
    const inputZoom = document.getElementById('input-zoom');
    const inputX = document.getElementById('input-x');
    const inputY = document.getElementById('input-y');
    
    // Render Elements
    const renderTitle = document.getElementById('render-title');
    const renderSubtitle = document.getElementById('render-subtitle');
    const renderBody = document.getElementById('render-body');
    const renderFooter = document.getElementById('render-footer');
    const renderImage = document.getElementById('render-image');
    
    // Canvas & UI Elements
    const wrapper = document.querySelector('.canvas-wrapper');
    const previewPanel = document.querySelector('.preview-panel');
    const btnDownload = document.getElementById('btn-download');
    const exportCanvas = document.getElementById('export-canvas');

    // --- 0. Warning UI ---
    function checkOverflow() {
        const contentBox = document.querySelector('.content-box');
        const warning = document.getElementById('overflow-warning');
        if (!contentBox || !warning) return;
        
        if (contentBox.scrollHeight > contentBox.clientHeight) {
            warning.style.display = 'block';
        } else {
            warning.style.display = 'none';
        }
    }

    // --- 1. Data Binding ---
    function updateText() {
        renderTitle.textContent = inputTitle.value;
        renderSubtitle.textContent = inputSubtitle.value;
        
        // Handle empty subtitle to hide the badge
        if (inputSubtitle.value.trim() === '') {
            renderSubtitle.style.display = 'none';
        } else {
            renderSubtitle.style.display = 'inline-block';
        }

        renderBody.textContent = inputBody.value;
        
        // Use setTimeout to ensure DOM is updated before checking height
        setTimeout(checkOverflow, 0);
    }

    inputTitle.addEventListener('input', updateText);
    inputSubtitle.addEventListener('input', updateText);
    inputBody.addEventListener('input', updateText);

    // --- 2. Logo Position Toggle ---
    function updateLogoPosition() {
        let selectedValue = 'bottom-left';
        for (const radio of radioPositions) {
            if (radio.checked) {
                selectedValue = radio.value;
                break;
            }
        }
        
        if (selectedValue === 'bottom-left') {
            renderFooter.classList.remove('logo-bottom-right');
            renderFooter.classList.add('logo-bottom-left');
        } else {
            renderFooter.classList.remove('logo-bottom-left');
            renderFooter.classList.add('logo-bottom-right');
        }
    }

    for (const radio of radioPositions) {
        radio.addEventListener('change', updateLogoPosition);
    }

    // --- 2.5 Layout & Image Toggle ---
    function updateLayout() {
        let selectedLayout = inputLayout.value;
        
        // Update ig-post classes
        exportCanvas.className = 'ig-post ' + inputTheme.value; // Theme class
        exportCanvas.classList.add(selectedLayout);

        // Show/hide image upload depending on layout
        if (selectedLayout === 'layout-text') {
            imageUploadGroup.style.display = 'none';
        } else {
            imageUploadGroup.style.display = 'flex';
        }
        
        setTimeout(checkOverflow, 0);
    }

    inputLayout.addEventListener('change', updateLayout);
    inputTheme.addEventListener('change', updateLayout);

    // --- Image Upload & Controls Logic ---
    function updateImageStyles() {
        const zoom = inputZoom.value;
        const x = inputX.value;
        const y = inputY.value;
        
        renderImage.style.backgroundSize = `${zoom}%`;
        renderImage.style.backgroundPosition = `${x}% ${y}%`;
    }

    inputZoom.addEventListener('input', updateImageStyles);
    inputX.addEventListener('input', updateImageStyles);
    inputY.addEventListener('input', updateImageStyles);

    // --- Image Upload Logic ---
    inputImage.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            // Set image as background
            renderImage.style.backgroundImage = `url(${event.target.result})`;
            updateImageStyles(); // Apply current slider values
        };
        reader.readAsDataURL(file);
    });

    // --- 3. Responsive Canvas Scaling ---
    // Make sure the 1080x1080 box fits within the preview panel visually
    function scaleCanvas() {
        const padding = 40; // padding from edges
        const availableWidth = previewPanel.clientWidth - padding * 2;
        const availableHeight = previewPanel.clientHeight - padding * 2;
        
        // Calculate the scale needed to fit 1080px in the available space
        const scale = Math.min(availableWidth / 1080, availableHeight / 1080, 1);
        
        wrapper.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', scaleCanvas);
    
    // Initialize scaling and text
    scaleCanvas();
    updateText();
    updateLogoPosition();
    updateLayout();

    // --- 4. Export logic via html2canvas ---
    btnDownload.addEventListener('click', async () => {
        try {
            // Provide feedback
            const originalText = btnDownload.innerHTML;
            btnDownload.innerHTML = '正在產生圖片...';
            btnDownload.disabled = true;

            // Fix html2canvas transform bug: Temporarily remove scale from the wrapper
            const originalTransform = wrapper.style.transform;
            wrapper.style.transform = 'scale(1)';
            
            // Wait a moment for DOM to apply the unscaled layout
            await new Promise(resolve => setTimeout(resolve, 100));

            // Generate canvas
            const canvas = await html2canvas(exportCanvas, {
                scale: 1,
                backgroundColor: null,
                logging: false,
                width: 1080,
                height: 1080
            });

            // Restore the scale
            wrapper.style.transform = originalTransform;

            // Trigger download
            const link = document.createElement('a');
            link.download = `JRI_Post_${new Date().getTime()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();

        } catch (error) {
            console.error('Error generating image:', error);
            alert('產生圖片時發生錯誤，請查看 Console 了解詳情。');
        } finally {
            // Restore button state
            btnDownload.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                下載 IG 貼文 (1080x1080)
            `;
            btnDownload.disabled = false;
        }
    });
});

</script>
