<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #eee; }
  .igPost { width: 1080px; height: 1080px; position: relative; display: flex; flex-direction: column; font-family: sans-serif; background: #121212; color: #fff; }
  
  /* LayoutFade styles */
  .postImage { position: absolute; top: 0; left: 0; right: 0; height: 70%; background: blue; z-index: 1; }
  .postImage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(18,18,18,0) 0%, rgba(18,18,18,1) 100%); }
  
  .contentBox { position: relative; flex: none; max-height: 45%; z-index: 2; background: transparent; padding: 40px 80px 140px 80px; justify-content: flex-start; margin-top: auto; display: flex; flex-direction: column; overflow: hidden; }
  
  .title { font-size: 85px; font-weight: bold; }
  .body { font-size: 28px; }
  .subtitle { padding: 8px 16px; border: 1px solid #333; display: inline-block; }
</style>
<script src="https://unpkg.com/modern-screenshot@4.4.35/dist/index.js"></script>
</head>
<body>
  <div id="capture" class="igPost">
    <div class="postImage"></div>
    <div class="contentBox">
      <div class="subtitle">最新消息發布</div>
      <div class="title">重要政策公告</div>
      <div class="body">
        •國家太空中心TASA-台灣布局全球衛星供應鏈SATELLITE 2026：衛星推進系統高壓氣瓶<br>
        •國家太空中心TASA專案供應商之一
      </div>
    </div>
  </div>
  <button onclick="capture()">Capture</button>
  <img id="result" style="width: 500px; border: 1px solid red; margin-top: 20px;" />
  <script>
    async function capture() {
      const node = document.getElementById('capture');
      modernScreenshot.domToPng(node).then(dataUrl => {
        document.getElementById('result').src = dataUrl;
        console.log("DONE");
      });
    }
  </script>
</body>
</html>
